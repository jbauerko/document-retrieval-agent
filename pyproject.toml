[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "document-retrieval-agent"
version = "0.1.0"
description = "Local agent for retrieving Nova Scotia regulatory matter documents"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "playwright>=1.58,<2",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.14"]

[project.scripts]
document-retrieval-agent = "document_retrieval_agent.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/document_retrieval_agent"]
